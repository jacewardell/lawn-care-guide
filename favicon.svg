<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The seven blade paths below are copied verbatim from the hero illustration in index.html
       (the first seven of its eighteen), so the favicon is literally a crop of that artwork.
       transform crops the hero region x 48..141, y 31..124 into the 64x64 box at scale 0.69,
       which puts the blade bases at y 49 and the tallest tip at y 9.
       Colours are the page's dark-theme turf and soil tokens, since the icon has a dark ground.
       Everything is clipped to the rounded square so no fill can square off a corner. -->
  <defs>
    <clipPath id="lawnClip"><rect width="64" height="64" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#lawnClip)">
    <rect width="64" height="64" fill="#18211B"/>
    <rect y="51.8" width="64" height="12.2" fill="#A78D6E"/>
    <g transform="scale(0.69) translate(-48,-30.96)" fill="#71A87C">
      <path d="M53 102q4-30 1-52q7 21 5 52z"/>
      <path d="M66 102q-5-33-2-56q9 23 7 56z"/>
      <path d="M80 102q5-28 12-48q-3 25-6 48z"/>
      <path d="M94 102q-4-35-1-58q9 24 7 58z"/>
      <path d="M108 102q6-26 14-44q-4 23-8 44z"/>
      <path d="M122 102q-5-31-2-53q9 22 7 53z"/>
      <path d="M136 102q4-34 1-57q8 24 6 57z"/>
    </g>
    <rect y="47.6" width="64" height="4.7" fill="#8A7053"/>
  </g>
</svg>
